name: bag-of-holding-mcp

# Four containers (one a one-shot), three networks, two public surfaces.
#
#   nginx-proxy-manager_default (external) ── mcp @ 172.22.0.44 ← NPM proxies
#                                              │                  the hostname
#   boh-internal (internal: true) ─────────────┤
#                                              ├── worlds-seed (one-shot; fills
#                                              │                the world shelf,
#                                              │                then exits)
#                                              ├── qdrant     (no public route)
#                                              └── embeddings (no public route)
#
# Naming rule, and it is load-bearing: the project name and every
# container_name share the `bag-of-holding-mcp` prefix, because
# docker/deploy.sh force-removes containers matching `^<project>-` that
# belong to a different compose project (its stray sweep) and passes
# `--remove-orphans`. A vaguer project name — `bag-of-holding`, say — would
# make this stack's deploy delete containers belonging to any other stack
# sharing that prefix, and the sibling engine repo is literally called
# bag-of-holding. If you ever containerise that one, give it a project name
# that is NOT a prefix of this one (`bag-of-holding-engine`, not
# `bag-of-holding`), or its deploys will reap these containers.
#
# Only `mcp` joins the proxy network, so Qdrant and the embedding
# service are unreachable from off-host by construction — `internal: true`
# gives them no gateway at all. That is why there are no firewall rules
# here and no published ports on either sidecar: there is nothing to
# firewall. Do NOT add `ports:` to them "for debugging"; use
# `docker compose exec` instead.
#
# Deploy: scripts/bootstrap-host.sh once, then CI (or
# `sudo -n /nebula/apps/deploy-bag-of-holding-mcp.sh`). See docs/deployment.md.

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    # Tagged so worlds-seed below can reuse this exact image instead of
    # declaring its own build — two build stanzas for one Dockerfile means
    # two images, two entries for the label-scoped prune to chase, and a
    # window where the seeder and the server disagree about what the
    # client library contains.
    image: bag-of-holding-mcp:local
    container_name: bag-of-holding-mcp-server
    environment:
      BOH_HTTP_PORT: "8091"
      BOH_DATA_DIR: /data
      # The browser pages (the client home at /, the atlas at /atlas), on
      # their own unauthenticated port. Safe to expose because that
      # listener serves static files and nothing else — no token, no store,
      # no shelf. Unset it and the surface does not exist.
      BOH_UI_PORT: "8099"
      # Set this when the proxy forwards a path prefix rather than
      # stripping it (nginx-proxy-manager Custom Locations do forward it).
      # Empty when the pages sit at the root of their own hostname.
      BOH_UI_BASE_PATH: ${BOH_UI_BASE_PATH:-}
      # The world shelf: baked cartridges, mounted read-only below. `:-`
      # and not `:?` for the same reason as the tenant registry — a server
      # with no worlds is a valid deployment, and world_catalog answers
      # cleanly for one rather than refusing to boot.
      BOH_WORLDS_DIR: ${BOH_WORLDS_DIR:-/worlds}
      # The allowlist IS the auth. bin/http.js refuses to start without
      # it rather than serving every campaign to anyone who finds the URL,
      # so a half-configured deploy fails closed instead of open.
      BOH_MEMORY_TOKEN_HASHES: ${BOH_MEMORY_TOKEN_HASHES:?set it in .env — comma-separated sha256 of the tokens you issued}
      # The hot-reloadable half of the allowlist, written by the admin panel
      # and mounted read-only below. Unioned with the hashes above, so this
      # stack keeps working with the file absent — which is also the
      # bootstrap order: this server comes up before the panel exists.
      # `:-` and not `:?` on purpose: unlike the hashes, an unset registry is
      # a valid deployment (env-only provisioning), not a misconfiguration.
      BOH_TENANT_REGISTRY: ${BOH_TENANT_REGISTRY:-/registry/tenants.json}
      # Internal Docker DNS, not the public hostname — no round trip
      # through NPM/TLS for containers sharing a network.
      BOH_EMBEDDINGS_URL: http://embeddings:80/v1
      BOH_EMBEDDINGS_MODEL: ${BOH_EMBEDDINGS_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      BOH_EMBEDDINGS_DIM: ${BOH_EMBEDDINGS_DIM:-256}
      BOH_QDRANT_URL: http://qdrant:6333
      BOH_QDRANT_COLLECTION: ${BOH_QDRANT_COLLECTION:-boh-memory}
      # Scene images. Rendering is opt-in: with no key the image tools still
      # gate and budget, they just hand the prompt back for the client to
      # render. Uncomment the key to render server-side instead — that spends
      # your account for every connected table, which is exactly what the
      # per-campaign budget is protecting. `:?` and not `:-`, for the same
      # reason as the Qdrant key below: an empty string is not "off", absent
      # is, so an uncommented-but-unset key must fail loudly.
      # BOH_IMAGE_API_KEY: ${BOH_IMAGE_API_KEY:?set it in .env to render images server-side}
      BOH_IMAGE_MODEL: ${BOH_IMAGE_MODEL:-google/gemini-2.5-flash-image}
      BOH_IMAGE_TIER: ${BOH_IMAGE_TIER:-free}
      # Inference relay. Same opt-in shape as the image key, and the same
      # warning with a bigger number attached: with this set, every relayed
      # turn from every tenant bills your provider account, which is what the
      # per-tenant token budget is protecting. Leave it commented and the
      # relay reports itself off, so hosts ask the player for their own key.
      # `:?` and not `:-` for the reason above: absent is off, empty is a
      # misconfiguration that must fail loudly rather than half-work.
      # BOH_LLM_API_KEY: ${BOH_LLM_API_KEY:?set it in .env to sell inference to tenants}
      BOH_LLM_TIER: ${BOH_LLM_TIER:-free}
      # BOH_QDRANT_API_KEY is intentionally absent — see the qdrant service.
      # Uncomment BOTH lines together if you ever enable the key.
      # BOH_QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      # Campaign memory + state vault. The irreplaceable one: vectors can
      # always be rebuilt from this by dropping the Qdrant collection and
      # letting the next search re-embed, but nothing rebuilds the log.
      - boh-data:/data
      # The tenant registry, READ-ONLY here. The admin panel is the only
      # writer; this server only ever reads. `ro` is what enforces the
      # single-writer split at the kernel rather than by convention — the
      # panel and this server must never both be able to write a file that
      # decides who is allowed in.
      - boh-registry:/registry:ro
      # The world shelf, READ-ONLY here for the registry's reason: only
      # src/worlds.js reads it, and the one writer (worlds-seed, plus
      # scripts/publish-revision.js in a one-off) must be the only thing
      # that CAN write. A cartridge is immutable the moment a campaign
      # pins its digest.
      - boh-worlds:/worlds:ro
    networks:
      # Pinned like the other stacks on this host: NPM caches the upstream
      # IP at config load, so a rebuild-assigned dynamic IP would 502 every
      # proxied call. Confirm .44 is free before the first deploy:
      #   docker network inspect nginx-proxy-manager_default
      nginx-proxy-manager_default:
        ipv4_address: 172.22.0.44
      boh-internal:
    depends_on:
      qdrant:
        condition: service_started
      embeddings:
        condition: service_started
      # Not ordering for its own sake: the shelf must be COMPLETE before
      # this process starts. createWorlds reads the directory once, at
      # boot, and never again — unlike the tenant registry, which
      # hot-reloads — so a cartridge that lands a second later stays
      # invisible until the next restart.
      worlds-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true              # every write goes to the volume or tmpfs
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The shelf-filler. A one-shot: it bakes the seeds named in
  # BOH_SEED_WORLDS into the worlds volume, SKIPS anything already there,
  # and exits. Every deploy re-runs it and every deploy after the first
  # reports "already on the shelf" — that is the design, not a wasted step.
  #
  # Why this is not baked into the image: a keyless bake is deterministic,
  # but deterministic-per-version is not the same as stable. Change the
  # generator and the same seed mints a different world — while campaigns
  # carry the old digest in their pin and fold their ledger over that exact
  # content. Baking at image build would re-mint the shelf on the next
  # unrelated deploy and strand every pinned campaign. Bake once into a
  # volume; keep the artifact.
  #
  # Deliberately NOT in DEPLOY_KEEP_SERVICES: it costs milliseconds when
  # there is nothing to do, and skipping it is how a shelf quietly stays
  # empty.
  worlds-seed:
    image: bag-of-holding-mcp:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bag-of-holding-mcp-worlds-seed
    entrypoint: ["node", "scripts/seed-worlds.js"]
    environment:
      BOH_WORLDS_DIR: /worlds
      # Comma-separated seeds. Empty is valid and means "I manage the shelf
      # myself" — the script says so and exits 0, so the gate opens.
      BOH_SEED_WORLDS: ${BOH_SEED_WORLDS:-}
    volumes:
      # The one writer. Read-write here, read-only everywhere else.
      - boh-worlds:/worlds
    networks:
      # boh-internal only: a keyless bake is pure computation and reaches
      # nothing. No egress, no proxy network, no public address.
      boh-internal:
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }


  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: bag-of-holding-mcp-qdrant
    # NO api key by default, and the omission is deliberate — an EMPTY key is
    # worse than none. `QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}` always
    # *defines* the variable; with an unset QDRANT_API_KEY it defines it as "".
    # Qdrant reads that as "auth is configured" and enforces a key that no
    # request can ever match, so every call 401s — including from the server
    # that shares the value. Blanking the .env line does not help; the variable
    # is still defined. Absent is the only way to mean "off".
    #
    # This costs nothing: qdrant sits on boh-internal (internal: true), with no
    # gateway and no published ports, so 6333 is unreachable from off-host.
    # To enable a key, uncomment below AND the matching line on the mcp service
    # — no `:-` default, so an unset variable becomes a loud compose error
    # rather than a silent lockout.
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - boh-qdrant:/qdrant/storage
    networks:
      - boh-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  embeddings:
    # Text Embeddings Inference serving Qwen3-Embedding-0.6B over an
    # OpenAI-compatible /v1/embeddings route. amd64-only image — this does
    # not run on Hetzner's ARM (CAX) instances, so keep this stack on a
    # CX/CPX box. Qwen3 needs TEI >= 1.8.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: bag-of-holding-mcp-embeddings
    # --max-batch-tokens is the single biggest lever on this container. TEI
    # defaults to 16384, sized for a throughput service; warmup runs inference
    # over a batch that large before it serves anything, which is both the
    # peak memory allocation of the whole process and minutes of CPU. This
    # workload is 1-3 sentence memories from one table, so 4096 costs nothing
    # real and cuts peak memory and warmup time by roughly fourfold.
    #
    # Keep it >= 8x the client's batch size (see MAX_BATCH in
    # src/memory/embedder.js): a single request larger than this ceiling is
    # rejected outright rather than split, so the two numbers move together.
    command: >
      --model-id ${BOH_EMBEDDINGS_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      --auto-truncate
      --max-batch-tokens ${EMBEDDINGS_MAX_BATCH_TOKENS:-4096}
    volumes:
      - boh-hf-cache:/data        # model downloads once, then cached
    networks:
      # TWO networks, and the second one is not optional: on first boot TEI
      # fetches the model from huggingface.co, and `boh-internal` has
      # internal: true — no gateway, no DNS, no internet. The container
      # crash-looped on
      #   dns error: failed to lookup address information
      # which reads like a network outage but is the isolation working as
      # designed. boh-egress restores OUTBOUND access only; nothing publishes
      # a port, so there is still no inbound path from off-host.
      - boh-internal
      - boh-egress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 0.6B of weights is ~2.4 GB; the rest is batch buffers, which the
    # --max-batch-tokens ceiling above now bounds. 8g is deliberate headroom
    # rather than a tight fit — the cgroup limit still stops a runaway from
    # eating the host, but nothing here should ever approach it. Raise it if
    # `docker inspect … {{.State.OOMKilled}}` ever reports true.
    mem_limit: ${EMBEDDINGS_MEM_LIMIT:-8g}
    cpus: "${EMBEDDINGS_CPUS:-2.0}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  nginx-proxy-manager_default:
    external: true               # existing NPM network: TLS + public hostname
  boh-internal:
    internal: true               # no gateway — the sidecars cannot be reached
    ipam:
      config:
        # Must not overlap NPM's 172.22.0.0/16 or agent-heartbeat's
        # 172.28.0.0/24 — Docker refuses overlapping pools and the error
        # arrives at `up`, not at config time.
        - subnet: 172.31.42.0/24
  boh-egress:
    # Deliberately NOT internal: the embedding server is the one container
    # that needs to reach the internet, and only to pull model weights.
    # Qdrant never joins this — it has no reason to talk to anything but mcp.
    #
    # No subnet pinned on purpose: Docker allocates from its default pool, so
    # this cannot collide with NPM (172.22/16), agent-heartbeat (172.28/24) or
    # boh-internal (172.31.42/24) the way a hand-picked range could.
    #
    # To harden later: once boh-hf-cache holds the model, set
    # HF_HUB_OFFLINE=1 on the embeddings service and drop this network — the
    # weights are already on the volume and it never needs egress again.
    driver: bridge

volumes:
  boh-data:                      # memory log + state vault (back this up)
  boh-registry:                  # tenant allowlist; the admin stack writes it
  boh-worlds:                    # baked cartridges (back this up)

  boh-qdrant:                    # vectors (rebuildable from boh-data)
  boh-hf-cache:                  # model weights (re-downloadable)
