# Test gate. Nothing merges on a red suite.
#
# Before this workflow no repo in the ecosystem ran a single test in CI, which
# is how a delisted model id, a version chimera in a vendored copy, and a replay
# path that throws on real sessions all reached the shipped game.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json declares engines.node >=22; testing on 20 gated a
          # contract the package does not make.
          node-version: '22'

      # Local development links the engine as a sibling checkout
      # (file:../bag-of-holding), which does not exist on a runner.
      #
      # CI installs it from the engine's OWN repository rather than from npm.
      # The three repos move together and a release lags the source by design —
      # resolving the peer range from the registry meant CI could only ever test
      # against the last published engine, so a tool written against a new
      # capability was unbuildable until someone remembered to publish. Testing
      # the source is also the more honest gate: it fails here, on the commit
      # that broke it, rather than after a release.
      # Point the dev dependency AT the source rather than installing it
      # afterwards: a separate `npm install` of the git spec has to reconcile
      # itself against the peer range and fails before it starts, because the
      # range names a version npm has not seen yet. Rewriting the dev
      # dependency lets one resolution satisfy both — the github tarball's own
      # package.json reports the engine's current version, which the caret
      # peer range accepts as long as the major matches.
      - name: Install with the engine from source
        run: |
          npm pkg set "devDependencies.@zeeuw/bag-of-holding"="github:D-dezeeuw/bag-of-holding#main"
          npm pkg set "devDependencies.@zeeuw/bag-of-holding-client"="github:D-dezeeuw/bag-of-holding-client#main"
          npm install --no-package-lock
          # Read the file, not the package path: the engine's `exports` map does
          # not expose ./package.json, so requiring it fails the whole step.
          node -p "'engine ' + JSON.parse(require('fs').readFileSync('node_modules/@zeeuw/bag-of-holding/package.json')).version + ' installed from source'"

      # The peer range is still the published contract. This says out loud when
      # the engine this package DECLARES is not on npm yet, so "works in CI,
      # uninstallable for users" cannot pass silently.
      - name: Warn when the declared engine is unpublished
        run: |
          want=$(node -p "require('./package.json').peerDependencies['@zeeuw/bag-of-holding']")
          if npm view "@zeeuw/bag-of-holding@$want" version >/dev/null 2>&1; then
            echo "engine $want is on npm"
          else
            echo "::warning::peerDependencies declares @zeeuw/bag-of-holding@$want, which is not published. CI is green against the engine source, but installing this package will fail for users until that version ships to npm."
          fi
          wantClient=$(node -p "require('./package.json').peerDependencies['@zeeuw/bag-of-holding-client']")
          if npm view "@zeeuw/bag-of-holding-client@$wantClient" version >/dev/null 2>&1; then
            echo "client $wantClient is on npm"
          else
            echo "::warning::peerDependencies declares @zeeuw/bag-of-holding-client@$wantClient, which is not published. CI is green against the client source, but installing this package will fail for users until that version ships to npm."
          fi

      - run: npm test
      - run: npm run typecheck
